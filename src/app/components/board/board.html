<section class="board">
  <app-buttons
    [editing]="isEditing()"
    (loadMutant)="onLoadMutant()"
    (loadHuman)="onLoadHuman()"
    (randomize)="onRandomize()"
    (validate)="onValidate()"
    (edit)="onEdit()"
  />
  <app-grid
    [dna]="dna()"
    [editable]="isEditing()"
    (dnaChange)="onDnaChange($event)"
    (cellError)="onGridError($event)"
  />
  <app-results [message]="resultMessage()" />
</section>
