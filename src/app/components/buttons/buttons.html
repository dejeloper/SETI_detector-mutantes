<div class="buttons">
  <button type="button" class="btn" [disabled]="editing()" (click)="onLoadMutant()">Cargar ADN mutante</button>
  <button type="button" class="btn" [disabled]="editing()" (click)="onLoadHuman()">Cargar ADN humano</button>
  <button type="button" class="btn" [disabled]="editing()" (click)="onRandomize()">Generar aleatorio</button>
  <button type="button" class="btn btn-primary" [disabled]="editing()" (click)="onValidate()">Validar ADN</button>
  <button type="button" class="btn btn-accent" (click)="onEdit()">{{ editing() ? 'Guardar' : 'Editar ADN' }}</button>
</div>
