<div class="buttons">
  <div class="buttons-demo">
    <button type="button" class="btn btn-demo" [disabled]="editing()" (click)="onLoadMutant()">
      <app-mutant-icon size="28px" />
      Demo Mutante
    </button>
    <button type="button" class="btn btn-demo" [disabled]="editing()" (click)="onLoadHuman()">
      <app-human-icon size="28px" />
      Demo Humano
    </button>
  </div>

  <div class="buttons-secondary">
    <button type="button" class="btn" [disabled]="editing()" (click)="onRandomize()">
      <app-shuffle-icon size="24px" />
      Generar aleatorio
    </button>
    <button type="button" class="btn btn-accent" (click)="onEdit()">
      <app-pencil-icon size="20px" />
      {{ editing() ? 'Guardar' : 'Editar ADN' }}
    </button>
  </div>

  <button type="button" class="btn btn-full" [disabled]="editing()" (click)="onValidate()">
    <app-microscope-icon size="28px" />
    Validar ADN
  </button>
</div>
